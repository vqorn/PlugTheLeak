name: Publish to npm

# Runs when a GitHub release is published. Uses npm Trusted Publishing:
# npm verifies that the request comes from this workflow in this repository,
# so no access token is stored anywhere. Configure it once on npmjs.com under
# the package's Settings > Trusted Publisher (GitHub Actions, workflow publish.yml).
#
# Before creating a release, bump "version" in package.json; npm refuses to
# publish the same version twice.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs a recent npm CLI.
      - run: npm install -g npm@latest
      - run: npm test
      - run: npm publish --access public
